<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rainbow Runner</title>
  <meta name="description" content="Unicorn running minigame! Collect stars and race down the rainbow road.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#bbf2f6">
  <style>
    /* --- 1. RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: linear-gradient(to bottom, #bbf2f6, #ffe1e8);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* --- 2. UI & CAMERA --- */
    .ui-layer {
      position: absolute; top: 30px; left: 0; width: 100%; z-index: 10; pointer-events: none;
      text-align: center; font-weight: bold; color: #4a154b;
      text-shadow: 2px 2px 0 #fff; font-size: 1.8rem; 
    }
    .game-viewport {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
      perspective: 200px; perspective-origin: 50% 20%;
    }

    /* --- 3. ENVIRONMENT & ROAD --- */
    .road-container {
      position: absolute; bottom: 0px; left: 50%; 
      width: 1000px; max-width: 90vw; height: 200vh;
      transform: translateX(-50%) rotateX(68deg); transform-style: preserve-3d; transform-origin: bottom center;
      will-change: transform;
    }

    @media (max-aspect-ratio: 1/1) {
      .road-container {
        width: 140vw;
        max-width: none;
      }
    }

    .road-lanes { display: flex; gap: 4%; width: 100%; height: 100%; transform-style: preserve-3d; }
    
    .lane {
      position: relative; flex: 1; transform-style: preserve-3d;
      background: 
        linear-gradient(to bottom, transparent 0%, var(--core) 45%, var(--core) 75%),
        linear-gradient(to bottom, transparent 0%, var(--core) 45%, var(--core) 75%),
        linear-gradient(to bottom, transparent 0%, var(--grad1) 45%, var(--grad2) 75%, var(--grad1) 100%);
      background-size: 10px 100%, 10px 100%, 100% 100%;
      background-position: 15px 0, calc(100% - 15px) 0, 0 0; background-repeat: no-repeat;
    }
    
    .lane::before {
      content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0.75;
      background: 
        linear-gradient(to bottom, transparent 0%, var(--glow) 45%, var(--glow) 75%),
        linear-gradient(to bottom, transparent 0%, var(--glow) 45%, var(--glow) 75%);
      background-size: 20px 100%, 20px 100%;
      background-position: 10px 0, calc(100% - 10px) 0; background-repeat: no-repeat;
    }
    
    .lane:nth-child(1) { --core: #ffea00; --grad1: #ffa801; --grad2: #ff4900; --glow: rgba(255, 234, 0, 0.8); }
    .lane:nth-child(2) { --core: #00e5ff; --grad1: #098bd7; --grad2: #6c32c4; --glow: rgba(0, 229, 255, 0.8); }
    .lane:nth-child(3) { --core: #ffcbdc; --grad1: #fd1767; --grad2: #c6024c; --glow: rgba(255, 203, 220, 0.8); }

    .rainbow {
      position: absolute; top: -2000px; left: 50%; width: 8000px; height: 55px; opacity: 0.8;
      transform: translateX(-50%) rotateX(-68deg); transform-origin: bottom center;
      display: flex; justify-content: center; align-items: center;
    }

    /* --- 4. PLAYER & ENTITIES --- */
    .player {
      position: absolute; bottom: 60px; width: 22%; aspect-ratio: 145 / 204; z-index: 5;
      transform: translateX(-50%) rotateX(-68deg); transform-origin: bottom center; transform-style: preserve-3d;
      transition: left 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: left, transform;
    }
    .player.facing-left { transform: translateX(-50%) rotateX(-68deg) scaleX(-1); }
    
    .unicorn-img {
      position: absolute; bottom: 80px; left: 0; width: 100%; height: 100%; z-index: 2;
      animation: gallop 0.8s ease-in-out infinite alternate;
      filter: drop-shadow(0 4px 6px rgba(95, 45, 121, 0.6));
      will-change: transform;
    }
    .player-shadow-unicorn {
      position: absolute; bottom: 0px; left: 50%; width: 65%; height: 65%; z-index: 1;
      transform: translateX(-50%) rotateX(68deg); transform-origin: center center; filter: brightness(0) opacity(0.3);
      animation: gallopShadow 0.8s ease-in-out infinite alternate;
    }

    .entity {
      position: absolute; width: 30.6%; height: 100px; top: 0; left: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .star { 
      position: absolute;
      left: 50%;
      top: 0;
      width: 55%;
      height: auto;
      z-index: 2;
      filter: drop-shadow(0 0 8px rgba(255, 220, 30, 0.9));
      animation: floatStar 1.2s ease-in-out infinite alternate;
    }
    .shadow {
      position: absolute; 
      bottom: 0px; 
      left: 50%; 
      width: 35%; 
      height: auto; 
      z-index: 1;
      filter: brightness(0) opacity(0.35);
      animation: floatShadow 1.2s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .gate {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 135%; /* Wider to span lane borders cleanly */
      height: auto;
      transform: translateX(-50%);
      transform-origin: bottom center;
      z-index: 2;
    }
    .gate-shadow {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 135%;
      height: auto;
      transform: translateX(-50%) rotateX(68deg);
      transform-origin: bottom center;
      filter: brightness(0) opacity(0.25);
      z-index: 1;
      pointer-events: none;
    }
    
    .gate-red { filter: brightness(1.3) drop-shadow(0 0 6px rgba(237, 103, 101, 0.8)); }
    .gate-blue { filter: hue-rotate(210deg) brightness(1.3) drop-shadow(0 0 6px rgba(55, 146, 210, 0.8)); }
    .gate-yellow { filter: hue-rotate(45deg) brightness(1.5) drop-shadow(0 0 6px rgba(255, 220, 30, 0.8)); }

    /* --- 5. KEYFRAMES --- */
    @keyframes gallop {
      from { transform: translateZ(60px) translateY(0px); }
      to { transform: translateZ(60px) translateY(-20px); }
    }
    @keyframes gallopShadow {
      from { transform: translateX(-50%) rotateX(68deg) scale(0.9); opacity: 0.4; }
      to { transform: translateX(-50%) rotateX(68deg) scale(1.1); opacity: 0.3; }
    }
    
    /* Star floating high off the road plane */
    @keyframes floatStar {
      from { transform: translateX(-50%) translateY(-100px); }
      to { transform: translateX(-50%) translateY(-170px); }
    }
    /* Compact ground shadow directly below floating star */
    @keyframes floatShadow {
      from { transform: translateX(-50%) rotateX(68deg) scale(0.7); opacity: 0.5; }
      to { transform: translateX(-50%) rotateX(68deg) scale(1.1); opacity: 0.25; }
    }

    @keyframes flashRed {
      0%, 100% { filter: drop-shadow(0 4px 6px rgba(95, 45, 121, 0.6)); }
      50% { filter: drop-shadow(0 4px 6px rgba(95, 45, 121, 0.6)) sepia(1) hue-rotate(-50deg) saturate(12); }
    }

    .hit-red {
      animation: gallop 0.8s ease-in-out infinite alternate, flashRed 0.5s ease-in-out !important;
    }
  </style>
</head>
<body>

  <div class="game-viewport" id="viewport">
    <div class="ui-layer" id="score-display">DISTANCE: 0m | POINTS: 0 | HEALTH: 2</div>

    <div class="road-container" id="road-container">
      <div class="road-lanes">
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
      </div>
      <div id="entities-layer" style="position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; top: 0; left: 0; pointer-events: none;"></div>
      
      <div class="player" id="player">
        <img src="assets/unicorn-back.svg" class="player-shadow-unicorn" id="shadow-img" />
        <img src="assets/unicorn-back.svg" class="unicorn-img" id="unicorn-img" />
      </div>
      
      <div class="rainbow"><img src="assets/rainbow.svg" /></div>
    </div>
  </div>

  <script>
    // System Variables
    const player = document.getElementById('player');
    const unicornImg = document.getElementById('unicorn-img');
    const shadowImg = document.getElementById('shadow-img');
    const roadContainer = document.getElementById('road-container');
    const entitiesLayer = document.getElementById('entities-layer');
    const scoreDisplay = document.getElementById('score-display');
    const viewport = document.getElementById('viewport');

    const laneColors = ['yellow', 'blue', 'red'];
    const gateColors = ['yellow', 'blue', 'red'];

    // Game State
    let currentLane = 1;
    let distance = 0;
    let points = 0;
    let health = 2;
    let nextHealthThreshold = 50;
    let spawnTimer = 0;
    const gameSpeed = 6;
    const entities = [];
    const lanePercentages = [15.33, 50, 84.66];

    // Player Logic
    function updatePlayerPosition() {
      player.style.left = `${lanePercentages[currentLane]}%`;

      if (currentLane === 0) {
        unicornImg.src = "assets/unicorn-side.svg";
        shadowImg.src = "assets/unicorn-side.svg";
        player.classList.remove('facing-left');
      } else if (currentLane === 2) {
        unicornImg.src = "assets/unicorn-side.svg";
        shadowImg.src = "assets/unicorn-side.svg";
        player.classList.add('facing-left');
      } else if (currentLane === 1) {
        unicornImg.src = "assets/unicorn-back.svg";
        shadowImg.src = "assets/unicorn-back.svg";
        player.classList.remove('facing-left');
      }
    }

    function movePlayer(direction) {
      const prevLane = currentLane;
      
      if (direction === -1 && currentLane > 0) currentLane--;
      if (direction === 1 && currentLane < 2) currentLane++;
      
      if (prevLane !== currentLane) {
        updatePlayerPosition();
      }
    }

    // Input Listeners
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
      if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
    });

    viewport.addEventListener('pointerdown', (e) => {
      movePlayer(e.clientX < window.innerWidth / 2 ? -1 : 1);
    });

    // Entity Spawner
    function spawnEntity() {
      const lane = Math.floor(Math.random() * 3);
      const isGate = Math.random() < 0.45;
      const el = document.createElement('div');
      el.className = 'entity';
      
      let type = 'star';
      let color = null;

      if (isGate) {
        type = 'gate';
        color = gateColors[Math.floor(Math.random() * gateColors.length)];
        el.innerHTML = `<img src="assets/gate.svg" class="gate-shadow" /><img src="assets/gate.svg" class="gate gate-${color}" />`;
      } else {
        el.innerHTML = '<img src="assets/star.svg" class="shadow" /><img src="assets/star.svg" class="star" />';
      }
      
      el.style.left = `${lanePercentages[lane]}%`;
      el.style.transform = `translate3d(-50%, -100px, 0) rotateX(-68deg)`;

      entitiesLayer.appendChild(el);
      entities.push({ element: el, lane: lane, y: -100, type: type, color: color, hasCollided: false });
    }

    // Main Game Loop
    function gameLoop() {
      distance += 0.1;
      scoreDisplay.innerText = `DISTANCE: ${Math.floor(distance)}m | POINTS: ${points} | HEALTH: ${health}`;

      if (++spawnTimer > 45) {
        spawnEntity();
        spawnTimer = 0;
      }

      const containerHeight = roadContainer.clientHeight;

      for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        ent.y += gameSpeed;
        
        ent.element.style.transform = `translate3d(-50%, ${ent.y}px, 0) rotateX(-68deg)`;

        const outOfBoundsThreshold = ent.type === 'gate' ? containerHeight + 350 : containerHeight + 100;

        if (ent.y > outOfBoundsThreshold) {
          ent.element.remove();
          entities.splice(i, 1);
          continue;
        }

        const isColliding = !ent.hasCollided && ent.y > containerHeight - 140 && ent.y < containerHeight - 80 && ent.lane === currentLane;

        if (isColliding) {
          ent.hasCollided = true;

          if (ent.type === 'gate') {
            const activeColor = laneColors[currentLane];
            if (ent.color === activeColor) {
              points += 5;
            } else {
              points -= 10;
              unicornImg.classList.remove('hit-red');
              void unicornImg.offsetWidth;
              unicornImg.classList.add('hit-red');

              setTimeout(() => {
                unicornImg.classList.remove('hit-red');
              }, 500);
            }
          } else if (ent.type === 'star') {
            points += 1;
            ent.element.remove();
            entities.splice(i, 1);
          }

          if (points <= 0) {
            points = 0;
            health--;
            if (health <= 0) {
              resetGame();
              break;
            }
          } else if (points >= nextHealthThreshold) {
            health++;
            nextHealthThreshold += 50;
          }

          scoreDisplay.innerText = `DISTANCE: ${Math.floor(distance)}m | POINTS: ${points} | HEALTH: ${health}`;
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      distance = 0;
      points = 0;
      health = 2;
      nextHealthThreshold = 50;
      scoreDisplay.innerText = `DISTANCE: 0m | POINTS: 0 | HEALTH: 2`;
      entities.forEach(ent => ent.element.remove());
      entities.length = 0;
    }
  
    // Initialize Game
    updatePlayerPosition();
    requestAnimationFrame(gameLoop);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
