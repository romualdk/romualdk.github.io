<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Runner</title>
    <meta name="description" content="Unicorn running minigame! Collect stars and race down the rainbow road.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #fff2f9; 
            background-image: 
                radial-gradient(circle at top left, #ff9de2 0%, transparent 60%),
                radial-gradient(circle at top right, #72f5ff 0%, transparent 60%),
                radial-gradient(circle at bottom right, #ffe17d 0%, transparent 60%),
                radial-gradient(circle at bottom left, #ffb3c6 0%, transparent 60%); 
            touch-action: none;
        }
        
        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #cloudCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }
        #sparkleCanvas { z-index: 3; pointer-events: none; }
        
        #gameHUD {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: clamp(16px, 4vw, 48px);
            background: rgba(30, 20, 40, 0.85);
            padding: 8px clamp(16px, 4vw, 48px);
            border-radius: 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 182, 215, 0.4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            font-size: clamp(18px, 4.5vw, 32px);
            color: #ff9de2;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(8px);
            align-items: center;
            white-space: nowrap;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 16px);
        }

        .hud-icon {
            width: clamp(28px, 6vw, 48px);
            height: clamp(28px, 6vw, 48px);
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            margin: -4px 0;
        }

        .hud-icon.rainbow-left-half {
            width: clamp(45px, 10vw, 80px);
            height: clamp(45px, 10vw, 80px);
            object-position: left;
            clip-path: inset(0 50% 0 0);
            margin: -6px clamp(-30px, -4vw, -10px) -6px 0;
        }

        #fpsCounter {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(20, 10, 30, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #gameOverScreen h1 {
            font-size: clamp(36px, 8vw, 64px);
            color: #ff006e;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(255, 0, 110, 0.5);
        }

        .stats-container {
            background: rgba(30, 20, 40, 0.75);
            border: 2px solid rgba(255, 182, 215, 0.4);
            border-radius: 24px;
            padding: 24px 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: min(320px, 90vw);
            backdrop-filter: blur(8px);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: clamp(16px, 4vw, 22px);
            gap: 24px;
        }

        .stat-label {
            color: #ff9de2;
            font-weight: 600;
        }

        .stat-value {
            color: #fff;
            font-weight: 700;
        }

        #restartHint {
            font-size: clamp(14px, 3vw, 18px);
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="gameHUD">
    <div class="hud-item"><img src="assets/rainbow.svg" class="hud-icon rainbow-left-half" alt="Rainbows"><span id="hudRainbows">0</span></div>
    <div class="hud-item"><img src="assets/unicorn.svg" class="hud-icon" alt="Distance"><span id="hudDist">0</span>m</div>
    <div class="hud-item"><img src="assets/star.svg" class="hud-icon" alt="Stars"><span id="hudStars">0</span></div>
    <div class="hud-item">❤️ <span id="hudLives">3</span></div>
</div>

<div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div class="stats-container">
        <div class="stat-row"><span class="stat-label">Top Speed:</span> <span id="statTopSpeed" class="stat-value">1.00x</span></div>
        <div class="stat-row"><span class="stat-label">Top Distance:</span> <span id="statTopDist" class="stat-value">0m</span></div>
        <div class="stat-row"><span class="stat-label">Top Stars:</span> <span id="statTopStars" class="stat-value">0</span></div>
    </div>
    <div id="restartHint">Restarting in 5s or click anywhere...</div>
</div>

<div id="fpsCounter">FPS: 60 | Speed: 1.00x | Entities: 0 | Dist: 0.00m | Stars: 0 | Rainbows: 0</div>
<div class="canvas-container">
    <canvas id="cloudCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <canvas id="sparkleCanvas"></canvas>
</div>

<script>
const cloudCanvas = document.getElementById('cloudCanvas');
const cloudCtx = cloudCanvas.getContext('2d');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const sparkleCanvas = document.getElementById('sparkleCanvas');
const sparkleCtx = sparkleCanvas.getContext('2d');
const fpsElem = document.getElementById('fpsCounter');

const hudStarsElem = document.getElementById('hudStars');
const hudDistElem = document.getElementById('hudDist');
const hudRainbowsElem = document.getElementById('hudRainbows');
const hudLivesElem = document.getElementById('hudLives');
const gameOverScreen = document.getElementById('gameOverScreen');
const statTopSpeed = document.getElementById('statTopSpeed');
const statTopDist = document.getElementById('statTopDist');
const statTopStars = document.getElementById('statTopStars');
const restartHint = document.getElementById('restartHint');

let gameTime = 0; 
let gameDistance = 0; 
let collectedStars = 0;
let passedRainbows = 0;
let globalSpeedMultiplier = 1.0;
let lastSpawnedGateType = null;
let lives = 3;
let isGameOver = false;
let restartTimeout = null;

let maxSpeedReached = 1.0;
let maxDistanceReached = 0;
let maxStarsReached = 0;

let shakeDuration = 0;
let shakeIntensity = 0;
let shakeOffsetX = 0;
let shakeOffsetY = 0;

function triggerCameraShake(intensity = 20, duration = 0.4) {
    shakeIntensity = intensity;
    shakeDuration = duration;
}

const player = {
    lane: 1,
    currentX: 0,
    size: 220,
    facing: 'right',
    yOffset: 0,
    yVelocity: 0
};

let debugMode = false;
let showCloudLayer = true;
let showMainLayer = true;
let showSparkleLayer = true;

function moveLeft() {
    if (isGameOver) return;
    if (player.lane > 0) {
        const oldLane = player.lane--;
        player.facing = (oldLane === 2) ? 'left' : 'right';
    }
}

function moveRight() {
    if (isGameOver) return;
    if (player.lane < 2) {
        const oldLane = player.lane++;
        player.facing = (oldLane === 0) ? 'right' : 'left';
    }
}

function jumpPlayer() {
    if (isGameOver) return;
    if (player.yOffset === 0) {
        player.yVelocity = 650;
    }
}

window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key === 'arrowleft' || key === 'a') moveLeft();
    if (key === 'arrowright' || key === 'd') moveRight();
    if (['arrowup', 'w', ' '].includes(key)) jumpPlayer();
    if (key === '`' || key === '~') {
        debugMode = !debugMode;
        fpsElem.style.display = debugMode ? 'block' : 'none';
    }
    if (e.key === '1') {
        showCloudLayer = !showCloudLayer;
        cloudCanvas.style.display = showCloudLayer ? 'block' : 'none';
    }
    if (e.key === '2') {
        showMainLayer = !showMainLayer;
        canvas.style.display = showMainLayer ? 'block' : 'none';
    }
    if (e.key === '3') {
        showSparkleLayer = !showSparkleLayer;
        sparkleCanvas.style.display = showSparkleLayer ? 'block' : 'none';
    }
});

let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', (e) => {
    if (isGameOver) {
        restartGame();
        return;
    }
    if (e.changedTouches.length === 0) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    const minSwipeDist = 30;

    if (Math.abs(deltaX) > Math.abs(deltaY)) {
        if (Math.abs(deltaX) > minSwipeDist) {
            if (deltaX > 0) moveRight();
            else moveLeft();
        }
    } else {
        if (deltaY < -minSwipeDist) {
            jumpPlayer();
        }
    }
}, { passive: true });

window.addEventListener('click', () => {
    if (isGameOver) {
        restartGame();
    }
});

const ASSETS = {
    star: Object.assign(new Image(), { src: 'assets/star.svg' }),
    sparkle: Object.assign(new Image(), { src: 'assets/sparkle.svg' }),
    redGate: Object.assign(new Image(), { src: 'assets/red-gate.svg' }),
    greenGate: Object.assign(new Image(), { src: 'assets/green-gate.svg' }),
    cloud: Object.assign(new Image(), { src: 'assets/cloud.svg' }),
    rainbow: Object.assign(new Image(), { src: 'assets/rainbow.svg' }),
    unicorn: Object.assign(new Image(), { src: 'assets/unicorn.svg' })
};

const ENTITY_SPEED = 0.1; 
const SPAWN_INTERVAL = 0.5;
const RAINBOW_SPAWN_INTERVAL = 5.0;
const FIXED_STAR_SIZE = 130;

let spawnTimer = 0;
let nextSpawnLaneIndex = 0; 
const spawnLaneSequence = [0, 1, 2, 1];
let rainbowTimer = 0; 

const particles = [];
const floatingTexts = [];

function createSpeedUpText(x, y) {
    floatingTexts.push({
        text: 'SPEED UP!',
        x: x,
        y: y,
        vy: -90, 
        alpha: 1.0,
        life: 1.0,
        decay: 1.0 
    });
}

function createStarBurst(x, y, count = 14, speedMult = 1) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4 - 0.2);
        const speed = (180 + Math.random() * 220) * speedMult;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: (20 + Math.random() * 25) * speedMult,
            alpha: 1.0,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 8,
            life: 1.0,
            decay: (1.8 + Math.random() * 0.8) / speedMult
        });
    }
}

function resize() {
    [cloudCanvas, canvas, sparkleCanvas].forEach(c => {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
    });
}
window.addEventListener('resize', resize);
resize();

const projection = {
    getCubeParams() {
        const w = canvas.width, h = canvas.height;
        return {
            size: Math.min(w, h) * 0.35,
            zBack: 25000,
            zFront: 150,   
            fov: 400,
            cx: w / 2,
            cy: h / 2
        };
    },
    project(ent, out = {}) {
        const p = this.getCubeParams();
        const currentZ = p.zBack - (p.zBack - p.zFront) * ent.z;
        out.scale = p.fov / currentZ;
        out.x = (ent.x * p.size) * out.scale + p.cx;
        out.y = ((ent.yRel - 0.5) * p.size * 2) * out.scale + p.cy;
        out.currentZ = currentZ;
        return out;
    }
};

const getRandomFullSpanX = () => -2.5 + Math.random() * 5.0;
const getCloudSize = () => (120 + Math.random() * 100) * (window.innerWidth < 768 ? 3.5 : 9);

const entities = [];
for (let i = 0; i < 200; i++) {
    entities.push({ type: 'sparkle', x: getRandomFullSpanX(), yRel: Math.random(), z: Math.random(), size: 10 + Math.random() * 16, speed: ENTITY_SPEED });
}
for (let i = 0; i < 100; i++) {
    entities.push({ type: 'cloud', x: getRandomFullSpanX() * 10, yRel: 1.5 + Math.random() * 0.5, z: Math.random(), size: getCloudSize() * 1.5, speed: ENTITY_SPEED });
}

function resetEntity(ent) {
    ent.z = 0.0;
    if (ent.type === 'sparkle') {
        ent.x = getRandomFullSpanX();
        ent.yRel = Math.random();
        ent.size = 10 + Math.random() * 16;
    } else if (ent.type === 'cloud') {
        ent.x = getRandomFullSpanX() * 3;
        ent.yRel = 1.3 + Math.random() * 0.5;
        ent.size = getCloudSize();
    }
}

function getPlayerBoundingBox() {
    const { size } = projection.getCubeParams();
    const laneWidth = (size * 2) / 3;
    const originPoint = projection.project({ x: 0, yRel: 0.5 + size / (size * 2), z: -5.0 }, {});
    const laneCenterX = (-size + (player.lane * laneWidth) + laneWidth / 2) / size;
    const frontCenter = projection.project({ x: laneCenterX, yRel: 0.5 + size / (size * 2), z: 1.0 }, {});

    const screenY = canvas.height - 40 - player.yOffset;
    const t = (screenY - originPoint.y) / (frontCenter.y - originPoint.y);
    const screenX = originPoint.x + (frontCenter.x - originPoint.x) * t;

    const h = player.size; 
    const bobOffset = player.yOffset === 0 ? Math.sin(gameTime * 14) * 8 : 0; 
    const w = h * (60 / 85);

    return {
        x: screenX - (w * 0.4),
        y: (screenY + bobOffset - (h / 2)) - (h * 0.4),
        width: w * 0.8,
        height: h * 0.8
    };
}

function triggerGameOver() {
    isGameOver = true;
    
    if (globalSpeedMultiplier > maxSpeedReached) maxSpeedReached = globalSpeedMultiplier;
    if (Math.floor(gameDistance) > maxDistanceReached) maxDistanceReached = Math.floor(gameDistance);
    if (collectedStars > maxStarsReached) maxStarsReached = collectedStars;

    const savedTopSpeed = Math.max(parseFloat(localStorage.getItem('rainbowRunner_topSpeed') || '1.0'), maxSpeedReached);
    const savedTopDist = Math.max(parseInt(localStorage.getItem('rainbowRunner_topDist') || '0'), maxDistanceReached);
    const savedTopStars = Math.max(parseInt(localStorage.getItem('rainbowRunner_topStars') || '0'), maxStarsReached);

    localStorage.setItem('rainbowRunner_topSpeed', savedTopSpeed.toFixed(2));
    localStorage.setItem('rainbowRunner_topDist', savedTopDist);
    localStorage.setItem('rainbowRunner_topStars', savedTopStars);

    statTopSpeed.textContent = savedTopSpeed.toFixed(2) + 'x';
    statTopDist.textContent = savedTopDist + 'm';
    statTopStars.textContent = savedTopStars;

    gameOverScreen.style.display = 'flex';

    let countdown = 5;
    restartHint.textContent = `Restarting in ${countdown}s or click anywhere...`;
    
    const interval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
            restartHint.textContent = `Restarting in ${countdown}s or click anywhere...`;
        } else {
            clearInterval(interval);
        }
    }, 1000);

    restartTimeout = setTimeout(() => {
        restartGame();
    }, 5000);
}

function restartGame() {
    if (restartTimeout) clearTimeout(restartTimeout);
    gameOverScreen.style.display = 'none';

    gameTime = 0;
    gameDistance = 0;
    collectedStars = 0;
    passedRainbows = 0;
    globalSpeedMultiplier = 1.0;
    lives = 3;
    isGameOver = false;
    spawnTimer = 0;
    rainbowTimer = 0;
    entities.length = 0;
    particles.length = 0;
    floatingTexts.length = 0;

    for (let i = 0; i < 200; i++) {
        entities.push({ type: 'sparkle', x: getRandomFullSpanX(), yRel: Math.random(), z: Math.random(), size: 10 + Math.random() * 16, speed: ENTITY_SPEED });
    }
    for (let i = 0; i < 100; i++) {
        entities.push({ type: 'cloud', x: getRandomFullSpanX() * 10, yRel: 1.5 + Math.random() * 0.5, z: Math.random(), size: getCloudSize() * 1.5, speed: ENTITY_SPEED });
    }
}

function update(dt) {
    if (isGameOver) return;

    gameTime += dt;
    gameDistance += 2 * globalSpeedMultiplier * dt;

    if (globalSpeedMultiplier > maxSpeedReached) maxSpeedReached = globalSpeedMultiplier;
    if (Math.floor(gameDistance) > maxDistanceReached) maxDistanceReached = Math.floor(gameDistance);
    if (collectedStars > maxStarsReached) maxStarsReached = collectedStars;

    if (player.yOffset > 0 || player.yVelocity !== 0) {
        player.yVelocity -= 1800 * dt;
        player.yOffset += player.yVelocity * dt;
        if (player.yOffset < 0) player.yOffset = player.yVelocity = 0;
    }

    if (shakeDuration > 0) {
        shakeDuration -= dt;
        shakeOffsetX = (Math.random() - 0.5) * 2 * shakeIntensity;
        shakeOffsetY = (Math.random() - 0.5) * 2 * shakeIntensity;
        if (shakeDuration <= 0) shakeOffsetX = shakeOffsetY = 0;
    }

    const { size } = projection.getCubeParams();
    const laneWidth = (size * 2) / 3;
    const targetLaneX = (-size + (player.lane * laneWidth) + laneWidth / 2) / size;
    player.currentX += (targetLaneX - player.currentX) * 15 * dt;

    spawnTimer += dt;
    const currentSpawnInterval = SPAWN_INTERVAL / globalSpeedMultiplier;
    if (spawnTimer >= currentSpawnInterval) {
        spawnTimer -= currentSpawnInterval;
        const laneIndex = spawnLaneSequence[nextSpawnLaneIndex];
        nextSpawnLaneIndex = (nextSpawnLaneIndex + 1) % spawnLaneSequence.length;
        const standardYRel = 0.5 + size / (size * 2);
        const randRoll = Math.random();
        const laneCenterX = (-size + (laneIndex * laneWidth) + laneWidth / 2) / size;

        if (randRoll < 0.67) {
            entities.push({ type: 'star', lane: laneIndex, x: laneCenterX, yRel: standardYRel - 0.08, z: 0.0, size: FIXED_STAR_SIZE, speed: ENTITY_SPEED, collected: false });
            lastSpawnedGateType = null;
        } else if (randRoll < 0.92 || lastSpawnedGateType === 'green') {
            entities.push({ type: 'gate', gateType: 'red', lane: laneIndex, x: laneCenterX, yRel: standardYRel - 0.05, z: 0.0, size: 140, speed: ENTITY_SPEED, hit: false });
            lastSpawnedGateType = 'red';
        } else {
            entities.push({ type: 'gate', gateType: 'green', lane: -1, x: 0, yRel: standardYRel - 0.05, z: 0.0, size: size * 2, speed: ENTITY_SPEED, hit: false });
            lastSpawnedGateType = 'green';
        }
    }

    rainbowTimer += dt;
    if (rainbowTimer >= RAINBOW_SPAWN_INTERVAL / globalSpeedMultiplier) {
        rainbowTimer -= RAINBOW_SPAWN_INTERVAL / globalSpeedMultiplier; 
        entities.push({ type: 'rainbow', x: 0, yRel: 0.5, z: 0.0, speed: ENTITY_SPEED, passed: false });
    }

    const playerBox = getPlayerBoundingBox();

    for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        ent.z += ent.speed * globalSpeedMultiplier * dt;

        if (ent.type === 'star' && !ent.collected && ent.z >= 0.98 && ent.lane === player.lane) {
            const p = projection.project(ent, {});
            const drawSize = ent.size * p.scale;
            const starBox = { x: p.x - drawSize * 0.4, y: p.y - drawSize * 0.4, width: drawSize * 0.8, height: drawSize * 0.8 };
            if (playerBox.x < starBox.x + starBox.width && playerBox.x + playerBox.width > starBox.x && playerBox.y < starBox.y + starBox.height && playerBox.y + playerBox.height > starBox.y) {
                collectedStars++;
                createStarBurst(p.x, p.y, 14, 1.0);
                entities.splice(i, 1);
                continue;
            }
        }

        if (ent.type === 'gate' && !ent.hit && ent.z >= 0.98) {
            let hitCondition = (ent.gateType === 'red' && ent.lane === player.lane) || (ent.gateType === 'green' && player.yOffset < 60);
            if (hitCondition) {
                const p = projection.project(ent, {});
                const drawW = ent.size * p.scale;
                const drawH = ent.gateType === 'red' ? drawW : (ent.size * (150 / 300)) * p.scale;
                const gateBox = { x: p.x - drawW * 0.5, y: p.y - drawH * 0.5, width: drawW, height: drawH };

                if (playerBox.x < gateBox.x + gateBox.width && playerBox.x + playerBox.width > gateBox.x && playerBox.y < gateBox.y + gateBox.height && playerBox.y + playerBox.height > gateBox.y) {
                    lives--;
                    triggerCameraShake(25, 0.45);
                    createStarBurst(p.x, p.y, 45, 2.2);
                    entities.splice(i, 1);

                    if (lives <= 0) {
                        triggerGameOver();
                    }
                    continue;
                }
            }
        }

        if (ent.type === 'rainbow' && !ent.passed && ent.z >= 1.0) {
            ent.passed = true;
            passedRainbows++;
            globalSpeedMultiplier *= 1.05;
            
            const centerLaneXIndex = 1;
            const centerLaneCenterX = (-size + (centerLaneXIndex * laneWidth) + laneWidth / 2) / size;
            const frontCenterPoint = projection.project({ x: centerLaneCenterX, yRel: 0.5 + size / (size * 2), z: 1.0 }, {});
            
            createSpeedUpText(frontCenterPoint.x, canvas.height * 0.35);
        }

        if (ent.z >= 0) {
            const p = projection.project(ent, {});
            let isOffScreen = false;

            if (['star', 'gate', 'rainbow'].includes(ent.type)) {
                const drawSize = (ent.type === 'rainbow' ? 1400 : ent.size) * p.scale;
                const top = p.y - drawSize * 0.5, bottom = p.y + drawSize * 0.5, left = p.x - drawSize * 0.5, right = p.x + drawSize * 0.5;
                isOffScreen = ent.z >= 1.0 || top > canvas.height + 100 || bottom < -100 || right < -100 || left > canvas.width + 100;
            } else {
                const drawSize = ent.size * p.scale;
                const top = p.y - (ent.type === 'cloud' ? drawSize * 0.25 : drawSize * 0.5);
                const bottom = p.y + (ent.type === 'cloud' ? drawSize * 0.25 : drawSize * 0.5);
                isOffScreen = top > canvas.height || bottom < 0 || p.x - drawSize * 0.5 > canvas.width || p.x + drawSize * 0.5 < 0 || ent.z >= 1.0;
            }

            if (isOffScreen) {
                if (['star', 'gate', 'rainbow'].includes(ent.type)) entities.splice(i, 1);
                else resetEntity(ent);
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rotation += p.vRot * dt;
        p.life -= p.decay * dt;
        p.alpha = Math.max(0, p.life);
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * dt;
        ft.life -= ft.decay * dt;
        ft.alpha = Math.max(0, ft.life);
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    hudStarsElem.textContent = collectedStars;
    hudDistElem.textContent = Math.floor(gameDistance);
    hudRainbowsElem.textContent = passedRainbows;
    hudLivesElem.textContent = lives;
}

function renderLanes() {
    const { size } = projection.getCubeParams();
    const laneWidth = (size * 2) / 3;
    const originPoint = projection.project({ x: 0, yRel: 0.5 + size / (size * 2), z: -5.0 }, {});
    const baseConfigs = [['#ffbe0b', '#fb5607'], ['#3a86ff', '#8338ec'], ['#ff006e', '#90003a']];

    for (let i = 0; i < 3; i++) {
        const xStart = -size + (i * laneWidth);
        const frontRight = projection.project({ x: (xStart + laneWidth) / size, yRel: 0.5 + size / (size * 2), z: 1.0 }, {});
        const frontLeft = projection.project({ x: xStart / size, yRel: 0.5 + size / (size * 2), z: 1.0 }, {});

        const extRight = frontRight.y >= canvas.height ? frontRight : { x: originPoint.x + (frontRight.x - originPoint.x) * ((canvas.height - originPoint.y) / (frontRight.y - originPoint.y)), y: canvas.height };
        const extLeft = frontLeft.y >= canvas.height ? frontLeft : { x: originPoint.x + (frontLeft.x - originPoint.x) * ((canvas.height - originPoint.y) / (frontLeft.y - originPoint.y)), y: canvas.height };

        const grad = ctx.createLinearGradient(originPoint.x, originPoint.y, (frontLeft.x + frontRight.x) / 2, (frontLeft.y + frontRight.y) / 2);
        const hexToRgba = (hex, alpha) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${alpha})`;
        
        grad.addColorStop(0.0, hexToRgba(baseConfigs[i][0], 0));
        grad.addColorStop(0.1, hexToRgba(baseConfigs[i][0], 1));
        grad.addColorStop(0.5, baseConfigs[i][1]);

        ctx.save();
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(originPoint.x, originPoint.y);
        ctx.lineTo(extRight.x, extRight.y);
        ctx.lineTo(extLeft.x, extLeft.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

function renderPlayer() {
    const { size } = projection.getCubeParams();
    const laneWidth = (size * 2) / 3;
    const originPoint = projection.project({ x: 0, yRel: 0.5 + size / (size * 2), z: -5.0 }, {});
    const laneCenterX = (-size + (player.lane * laneWidth) + laneWidth / 2) / size;
    const frontCenter = projection.project({ x: laneCenterX, yRel: 0.5 + size / (size * 2), z: 1.0 }, {});

    const screenY = canvas.height - 40 - player.yOffset;
    const screenX = originPoint.x + (frontCenter.x - originPoint.x) * ((screenY - originPoint.y) / (frontCenter.y - originPoint.y));
    const h = player.size;
    const w = h * (60 / 85);

    ctx.save();
    ctx.translate(screenX, screenY + (player.yOffset === 0 ? Math.sin(gameTime * 14 * Math.sqrt(globalSpeedMultiplier)) * 8 : 0));
    ctx.rotate(Math.sin(gameTime * 7) * 0.03);
    if (player.facing === 'left') ctx.scale(-1, 1);

    if (ASSETS.unicorn.complete && ASSETS.unicorn.naturalWidth !== 0) {
        ctx.drawImage(ASSETS.unicorn, -w / 2, -h, w, h);
    } else {
        ctx.fillStyle = '#ff006e';
        ctx.beginPath();
        ctx.arc(0, -h / 2, h / 4, 0, Math.PI * 2);
        ctx.fill();
    }

    if (debugMode) {
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.strokeRect(-w / 2, -h, w, h);
    }
    ctx.restore();
}

function renderParticles() {
    if (!showSparkleLayer || !ASSETS.star.complete || !ASSETS.star.naturalWidth) return;
    particles.forEach(p => {
        sparkleCtx.save();
        sparkleCtx.globalAlpha = p.alpha;
        sparkleCtx.translate(p.x, p.y);
        sparkleCtx.rotate(p.rotation);
        sparkleCtx.drawImage(ASSETS.star, -p.size * p.life / 2, -p.size * p.life / 2, p.size * p.life, p.size * p.life);
        sparkleCtx.restore();
    });
}

function renderFloatingTexts() {
    if (floatingTexts.length === 0) return;

    ctx.save();
    ctx.font = '900 42px "Segoe UI", Tahoma, Geneva, Verdana, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        
        const textMetrics = ctx.measureText(ft.text);
        const boxWidth = textMetrics.width + 50;
        const boxHeight = 60;
        const boxX = ft.x - boxWidth / 2;
        const boxY = ft.y - boxHeight / 2;
        const radius = 30;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.strokeStyle = 'rgba(255, 182, 215, 0.8)';
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxWidth, boxHeight, radius);
        ctx.fill();
        ctx.stroke();

        ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        ctx.fillStyle = '#ff006e';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';

        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    ctx.restore();
}

function render() {
    [cloudCtx, ctx, sparkleCtx].forEach((c, idx) => c.clearRect(0, 0, [cloudCanvas, canvas, sparkleCanvas][idx].width, [cloudCanvas, canvas, sparkleCanvas][idx].height));

    [cloudCtx, ctx, sparkleCtx].forEach(c => {
        c.save();
        c.translate(shakeOffsetX, shakeOffsetY);
    });

    renderLanes();

    entities.sort((a, b) => projection.project(b, {}).currentZ - projection.project(a, {}).currentZ);

    entities.forEach(ent => {
        if (ent.z < 0) return;
        const p = projection.project(ent, {});
        const targetCtx = ent.type === 'cloud' ? cloudCtx : (ent.type === 'sparkle' ? sparkleCtx : ctx);

        let bw = 0, bh = 0;
        if (ent.type === 'rainbow') { bw = 1400 * p.scale; bh = 800 * p.scale; }
        else if (ent.type === 'gate') {
            bw = ent.size * p.scale;
            bh = ent.gateType === 'red' ? bw : (ent.size * (150 / 300)) * p.scale;
        } else {
            bw = ent.size * p.scale;
            bh = ent.type === 'cloud' ? bw * 0.5 : bw;
        }

        const bx = p.x - bw / 2, by = p.y - bh / 2;

        targetCtx.save();
        if (['cloud', 'rainbow'].includes(ent.type)) targetCtx.globalAlpha = Math.min(1.0, Math.max(0.0, ent.z));

        let img = ASSETS[ent.type];
        if (ent.type === 'gate') img = ent.gateType === 'red' ? ASSETS.redGate : ASSETS.greenGate;

        if (img && img.complete && img.naturalWidth !== 0) {
            targetCtx.drawImage(img, bx, by, bw, bh);
        } else if (ent.type === 'cloud') {
            targetCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            targetCtx.beginPath();
            targetCtx.ellipse(p.x, p.y, bw / 2, bh / 2, 0, 0, Math.PI * 2);
            targetCtx.fill();
        }
        targetCtx.restore();

        if (debugMode) {
            targetCtx.strokeStyle = ent.type === 'sparkle' ? '#00ffcc' : (ent.type === 'cloud' ? '#ffaa00' : (ent.type === 'gate' ? (ent.gateType === 'red' ? '#ff0000' : '#00ff00') : '#ff00ff'));
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(bx, by, bw, bh);
        }
    });

    renderPlayer();
    renderParticles();
    renderFloatingTexts();

    if (debugMode) {
        const pBox = getPlayerBoundingBox();
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.strokeRect(pBox.x, pBox.y, pBox.width, pBox.height);
        fpsElem.textContent = `FPS: 60 | Speed: ${globalSpeedMultiplier.toFixed(2)}x | Entities: ${entities.length} | Dist: ${Math.floor(gameDistance)}m | Stars: ${collectedStars} | Rainbows: ${passedRainbows}`;
    }

    [cloudCtx, ctx, sparkleCtx].forEach(c => c.restore());
}

let lastTime = 0, isTabPaused = false;
document.addEventListener('visibilitychange', () => {
    isTabPaused = document.hidden;
    if (!isTabPaused) lastTime = performance.now();
});

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (!isTabPaused && !isGameOver) {
        update(dt);
        render();
    } else if (isGameOver) {
        render(); // Keep rendering the background scene behind the overlay
    }
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
